name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --all-groups --all-extras --frozen

      - name: Lint
        run: uv run ruff check --output-format=github ./src ./tests && uv run pyright
          --project ./

      - name: Docs Lint
        run: uv run pymarkdown --config .pymarkdown.json scan README.md docs

      - name: Test
        run: uv run pytest --rootdir= ./tests --doctest-modules
          --junitxml=junit/test-results.xml

      - name: Test (native State)
        run: uv run pytest --rootdir= ./tests --doctest-modules
        env:
          HAIWAY_NATIVE: "1"

      - name: Build
        run: uv build
