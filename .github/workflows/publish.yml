name: publish

on:
  release:
    types:
      - released

# no job receives a token unless it asks for one
permissions: {}

jobs:
  # dependencies and tests run here, where no publishing credential exists
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15"

      - name: Install
        run: uv sync --all-groups --all-extras --frozen

      - name: Lint
        run: uv run bandit -q -r ./src && uv run ruff check --output-format=github ./src ./tests
          && uv run pyright --project ./

      - name: Test
        run: uv run pytest --rootdir= ./tests --doctest-modules
          --junitxml=junit/test-results.xml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15"

      - name: Publish
        env:
          PROJECT_VERSION: ${{ github.event.release.tag_name }}
        run: uv build && uv publish
