name: Docs

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15"

      - name: Install docs dependencies
        run: uv sync --no-default-groups --group docs --all-extras --frozen

      - name: Build MkDocs site
        run: uv run --frozen --no-default-groups --group docs mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
