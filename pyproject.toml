[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "draive"
description = "Framework designed to simplify and accelerate the development of LLM-based applications."
version = "0.119.0"
readme = "README.md"
maintainers = [
  { name = "Kacper Kaliński", email = "kacper.kalinski@miquido.com" },
]
requires-python = ">=3.14"
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy~=2.5", "haiway~=0.60.0", "pyyaml~=6.0"]

[project.urls]
Homepage = "https://miquido.com"
Repository = "https://github.com/miquido/draive.git"

[project.optional-dependencies]
cohere = ["cohere~=7.0"]
cohere_bedrock = ["cohere~=7.0", "boto3~=1.43"]
openai = ["openai~=3.2"]
openai_realtime = ["openai[realtime]~=3.2"]
anthropic = ["anthropic~=2.6"]
anthropic_bedrock = ["anthropic[bedrock]~=2.6"]
mistral = ["mistralai~=3.7"]
gemini = ["google-genai~=3.0"]
ollama = ["ollama~=0.6.2"]
bedrock = ["boto3~=1.43"]
aws = ["boto3~=1.43"]
vllm = ["openai~=3.2"]
mcp = ["mcp~=2.1", "httpx2~=2.16"]
opentelemetry = [
  "haiway[opentelemetry]",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-grpc",
]
httpx = ["haiway[httpx]"]
starlette = ["haiway[starlette]", "starlette~=1.10"]
fastapi = ["haiway[fastapi]", "fastapi~=0.162", "starlette~=1.10"]
postgres = ["haiway[postgres]", "asyncpg"]
rabbitmq = ["haiway[rabbitmq]", "pika"]
qdrant = ["qdrant-client~=1.19"]
surrealdb = ["surrealdb~=3.0"]
surrealdb_embedded = ["surrealdb[embedded]~=3.0"]

[dependency-groups]
# development tooling lives in dependency groups (synced by default, never published)
# while the integration extras stay optional dependencies of the package itself
dev = [
  "draive[cohere,cohere_bedrock,openai,openai_realtime,anthropic,anthropic_bedrock,mistral,gemini,ollama,bedrock,aws,vllm,mcp,opentelemetry,httpx,starlette,fastapi,postgres,rabbitmq,qdrant,surrealdb,surrealdb_embedded]",
  "bandit~=1.9",
  "jsonschema~=4.26",
  "pyright~=1.1",
  "pytest~=9.2",
  "pytest-asyncio~=1.4",
  "pytest-cov~=7.1",
  "ruff~=0.17",
]
docs = [
  "draive[cohere,cohere_bedrock,openai,openai_realtime,anthropic,anthropic_bedrock,mistral,gemini,ollama,bedrock,aws,vllm,mcp,opentelemetry,httpx,starlette,fastapi,postgres,rabbitmq,qdrant,surrealdb,surrealdb_embedded]",
  "mkdocs~=1.6",
  "mkdocs-material~=9.8",
  "mkdocstrings[python]~=1.0",
  "mdformat~=1.0",
  "mdformat-gfm~=1.0",
  "pymarkdownlnt~=0.9",
  "mkdocs-build-plantuml-plugin~=2.1",
  "mdformat-mkdocs~=5.3",
]

[tool.uv]
required-version = "==0.13.7"
default-groups = "all"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", ".git", ".cache"]
lint.select = ["E", "F", "A", "I", "B", "PL", "W", "C", "RUF", "UP", "NPY201"]
lint.ignore = ["A005", "PLC0415"]
lint.pydocstyle.convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"./tests/*.py" = ["PLR2004"]

[tool.ruff.lint.pylint]
max-args = 12

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["./src"]
exclude = ["**/node_modules", "**/__pycache__"]
stubPath = "./stubs"
reportMissingImports = true
reportMissingTypeStubs = false
useLibraryCodeForTypes = true
typeCheckingMode = "strict"

[tool.uv-build]
packages = [{ include = "draive", from = "src" }]

[tool.uv-build.sdist]
exclude = [
  "site",
  "docs",
  "tests",
  ".github",
  "stubs",
  "config",
  "llms.txt",
  ".vscode",
  ".claude",
  ".codex",
  ".zed",
  ".venv",
  "**/.DS_Store",
  "**/__pycache__",
  ".ruff_cache",
  ".pytest_cache",
  ".mypy_cache",
]

[tool.uv-build.wheel]
exclude = ["**/.DS_Store", "**/__pycache__", "**/*.pyc"]
